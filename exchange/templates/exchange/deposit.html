<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deposit Funds</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded shadow-md w-96">
        <h2 class="text-2xl font-bold text-yellow-500 mb-6 text-center">Deposit via bKash / Bank</h2>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-yellow-500 text-black font-bold p-2 rounded">Submit Deposit</button>
        </form>
        <a href="{% url 'dashboard' %}" class="block mt-4 text-center text-sm text-gray-400">Back to Dashboard</a>
    </div>
</body>
</html>
