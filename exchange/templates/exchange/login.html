<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Crypto Exchange</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded shadow-md w-96">
        <h2 class="text-2xl font-bold text-yellow-500 mb-6 text-center">Login to Exchange</h2>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-yellow-500 text-black font-bold p-2 rounded">Login</button>
        </form>
        <p class="mt-4 text-sm text-center">Don't have an account? <a href="{% url 'register' %}" class="text-yellow-400">Register</a></p>
    </div>
</body>
</html>
